;; Standalone Hypergrid starter profile.
;; Copy with config-profiles\switch-to-standalone-hg.ps1 instead of manually
;; overwriting your current OSGrid OpenSim.ini.

[Const]
    BaseHostname = "CHANGE_ME_PUBLIC_HOST"
    BaseURL = http://${Const|BaseHostname}
    PublicPort = "9000"
    PrivURL = ${Const|BaseURL}
    PrivatePort = "8003"
    GridName = "Vanilla Sim"
    GridNick = "vanilla"

[Startup]
    ConsolePrompt = "StandaloneHG (\R) # "
    ConsoleHistoryFileEnabled = true
    save_crashes = false
    async_call_method = SmartThreadPool
    MaxPoolThreads = 300
    MinPoolThreads = 32

    physical_prim = true
    meshing = ubODEMeshmerizer
    physics = ubODE
    DefaultScriptEngine = "YEngine"

    NonPhysicalPrimMax = 256
    PhysicalPrimMax = 64
    ClampPrimSize = false
    LinksetPrims = 0
    CombineContiguousRegions = false

[Network]
    http_listener_port = ${Const|PublicPort}
    ExternalHostNameForLSL = ${Const|BaseHostname}

[Hypergrid]
    GatekeeperURI = "${Const|BaseURL}:${Const|PublicPort}"
    HomeURI = "${Const|BaseURL}:${Const|PublicPort}"

[LoginService]
    WelcomeMessage = "Welcome to Vanilla Sim"
    SRV_HomeURI = "${Hypergrid|HomeURI}"
    SRV_InventoryServerURI = "${Const|BaseURL}:${Const|PublicPort}"
    SRV_AssetServerURI = "${Const|BaseURL}:${Const|PublicPort}"
    SRV_ProfileServerURI = "${Const|BaseURL}:${Const|PublicPort}"
    SRV_FriendsServerURI = "${Const|BaseURL}:${Const|PublicPort}"
    SRV_IMServerURI = "${Const|BaseURL}:${Const|PublicPort}"
    MapTileURL = "${Const|BaseURL}:${Const|PublicPort}/"
    Currency = "G$"
    AllowLoginFallbackToAnyRegion = true

[Messaging]
    MessageTransferModule = HGMessageTransferModule
    LureModule = HGLureModule
    OfflineMessageModule = "Offline Message Module V2"
    OfflineIMService = "OpenSim.Addons.OfflineIM.dll:OfflineIMService"
    StorageProvider = "OpenSim.Data.SQLite.dll"
    ConnectionString = "URI=file:StandaloneHG/offlineim.db;UseUTF16Encoding=True"
    Realm = "im_offline"
    ForwardOfflineGroupMessages = true

[Map]
    GenerateMaptiles = true
    MapImageModule = "Warp3DImageModule"
    MaptileRefresh = 0
    GenerateMaptilesInBackground = true
    MaptileStartupDelaySeconds = 180
    MaptileThreadStackSizeKB = 8192
    MaptileDeferIfAgentsPresent = true
    MaptileForceGC = false
    StoreLegacyMaptileAssets = false
    TextureOnMapTile = true
    DrawPrimOnMapTile = true
    MapWaterDepthShading = true
    Map3DWaterDepthShading = true
    Map3DWaterDepthOpacity = 0.85

[Weather]
    Enabled = true
    AllowDisabled = false
    CommandChannel = 89
    EstateManagerOnly = true
    EmitterGrid = 8
    EmitterHeight = 18
    Intensity = 1.0
    AvoidCoveredAreas = true
    CoverProbeHeight = 96
    AdjustClouds = true
    RestoreCloudsOnClear = true
    AdjustWind = true
    RestoreWindOnClear = true
    WindDirectionDegrees = 70
    WindDirectionVarianceDegrees = 18
    RainWindStrength = 0.45
    StormWindStrength = 1.35
    SnowWindStrength = 0.22
    LightningEnabled = true
    LightningMinDelayMS = 7000
    LightningMaxDelayMS = 18000
    ThunderEnabled = true
    ThunderSound =
    ThunderVolume = 1.0
    AutoCycleEnabled = true
    AutoCycleHours = 6
    AutoCycleStartupDelaySeconds = 30
    AutoCycleChangeOnStartup = true
    AutoCycleChoices = storm,rain,snow,sunny,clear
    AutoCycleForecastWarningMinutes = 15
    AutoCycleForecastWarningMessage = Weather forecast update: next conditions for {RegionName} are expected to shift to {NextWeather} in {TimeUntilNextForecast}.
    SendWeatherIMOnEntry = true
    WeatherIMDelaySeconds = 8
    WeatherIMMessage = Weather forecast for {RegionName}: current conditions are {Weather}. Next forecast: {NextForecast}. Stay tuned for further regional updates.

[Permissions]
    permissionmodules = DefaultPermissionsModule
    serverside_object_permissions = true
    allow_grid_gods = true

[Economy]
    economymodule = BetaGridLikeMoneyModule
    SellEnabled = true
    PriceUpload = 0
    PriceGroupCreate = 0
    InitialBalance = 1000
    BalanceStorage = StandaloneHG/Currency/balances.tsv
    TransactionLog = StandaloneHG/Currency/transactions.tsv
    AuditEnabled = true
    AllowNegativeBalances = false

[Groups]
    Enabled = true
    LevelGroupCreate = 0
    Module = "Groups Module V2"
    StorageProvider = "OpenSim.Data.SQLite.dll"
    ConnectionString = "URI=file:StandaloneHG/groups.db;UseUTF16Encoding=True"
    Realm = "os_groups"
    ServicesConnectorModule = "Groups HG Service Connector"
    LocalService = local
    OfflineIMService = "OpenSim.Addons.OfflineIM.dll:OfflineIMService"
    UserAccountService = "OpenSim.Services.UserAccountService.dll:UserAccountService"
    GroupsExternalURI = "${Hypergrid|HomeURI}"
    HomeURI = "${Hypergrid|HomeURI}"
    ShowForeignActiveGroupTitles = true
    MessagingEnabled = true
    MessagingModule = "Groups Messaging Module V2"
    NoticesEnabled = true
    MessageOnlineUsersOnly = true
    DebugEnabled = false
    MessagingDebugEnabled = false

[RegionWeb]
    Enabled = true
    PublicPath = "/regionweb"
    ContentDirectory = "RegionWeb"
    EstateTitle = "Vanilla Sim"
    AutoCreateContent = true
    ShowMap = true
    ShowStats = true
    ShowParcels = true
    PostsPerPage = 5

    CurrencyPortalEnabled = true
    CurrencyBuyEnabled = true
    CurrencyBuyMode = "request"
    CurrencyPurchaseStorage = "StandaloneHG/Currency/regionweb-purchases.tsv"
    CurrencyTransferEnabled = true
    CurrencyChallengeMinutes = 10
    CurrencyChallengeCooldownSeconds = 20
    CurrencySessionHours = 12
    CurrencyStatementLimit = 50
    CurrencyBuyLimit = 100000

    PayPalEnabled = false
    PayPalEnvironment = "sandbox"
    PayPalClientID = ""
    PayPalClientSecret = ""
    PayPalCurrencyCode = "EUR"
    PayPalPricePerToken = "0.01"
    PayPalReturnBaseUrl = ""
    PayPalOrderStorage = "StandaloneHG/Currency/regionweb-paypal-orders.tsv"

[GridInfo]
    GridName = "Vanilla Sim"
    GridNick = "vanilla"
    gridname = "Vanilla Sim"
    gridnick = "vanilla"

[GridInfoService]
    gridname = "Vanilla Sim"
    gridnick = "vanilla"
    welcome = "${Const|BaseURL}:${Const|PublicPort}/regionweb"
    about = "${Const|BaseURL}:${Const|PublicPort}/regionweb"
    help = "${Const|BaseURL}:${Const|PublicPort}/regionweb"
    register = "${Const|BaseURL}:${Const|PublicPort}/regionweb"
    economy = "${Const|BaseURL}:${Const|PublicPort}/regionweb"

[MultiGridAttachments]
    ;; Optional fan-out registration for publishing the same running regions
    ;; to additional grid registries. The simulator still has one primary grid
    ;; for identity, inventory, assets and presence; secondary attachments are
    ;; best-effort publication endpoints and require the target grid to allow
    ;; your region server to register.
    Enabled = false
    Grids = "osgrid,neverworld"
    ContinueOnFailure = true
    ;; Secondary grids may call this simulator's /agent endpoint directly.
    ;; Keep this on for MultiGrid publication so local presence is created for
    ;; those inbound teleports before Scene.VerifyUserPresence runs.
    AutoCreateInboundPresence = true

[MultiGridAttachment.osgrid]
    Enabled = false
    GridServerURI = "http://hg.osgrid.org:80"
    ExternalHostName = "CHANGE_ME_PUBLIC_HOST"
    ServerURI = "http://CHANGE_ME_PUBLIC_HOST:9000"
    ;; Empty Regions means every local region. Otherwise use region names or UUIDs.
    Regions = ""
    ;; Optional target-grid location in region coordinates, for example 10463,8886.
    Location = ""
    TimeoutSeconds = 5
    Strict = false

[MultiGridAttachment.neverworld]
    Enabled = false
    ;; Neverworld's public HG login/gatekeeper is 8002; region registration
    ;; uses their GridService endpoint on 8003.
    GridServerURI = "http://hg.neverworldgrid.com:8003"
    GridPostURI = "http://hg.neverworldgrid.com:8003/grid"
    ExternalHostName = "CHANGE_ME_PUBLIC_HOST"
    ServerURI = "http://CHANGE_ME_PUBLIC_HOST:9000"
    Regions = ""
    Location = ""
    TimeoutSeconds = 5
    Strict = false

[MultiGridAttachment.vanilla]
    ;; Optional self-grid attachment for non-standalone-primary profiles.
    ;; In this standalone profile, Vanilla is already the primary grid, so keep
    ;; this disabled unless you deliberately run with another primary grid.
    Enabled = false
    GridServerURI = "http://CHANGE_ME_PUBLIC_HOST:9000"
    ExternalHostName = "CHANGE_ME_PUBLIC_HOST"
    ServerURI = "http://CHANGE_ME_PUBLIC_HOST:9000"
    Regions = ""
    Location = ""
    TimeoutSeconds = 5
    Strict = false

[TextBuild]
    Enabled = true
    CommandChannel = 88
    EstateManagerOnly = true
    ImageTerrainMinLandHeight = 0.35
    ImageTerrainMaxLandHeight = 4.8
    ImageTerrainSeaDepth = 3.0
    ImageTerrainFitLandToRegion = true
    ImageTerrainSmoothPasses = 24

[Terrain]
    InitialTerrain = "pinhead-island"

[YEngine]
    Enabled = true
    MinTimerInterval = 0.05

[OSSL]
    Include-osslDefaultEnable = "config-include/osslDefaultEnable.ini"

[Architecture]
    Include-Storage = "config-include/storage/SQLiteStandalone.ini"
    Include-Architecture = "config-include/StandaloneHypergrid.ini"
