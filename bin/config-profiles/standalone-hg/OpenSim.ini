;; Standalone Hypergrid starter profile.
;; Copy with config-profiles\switch-to-standalone-hg.ps1 instead of manually
;; overwriting your current OSGrid OpenSim.ini.

[Const]
    BaseHostname = "CHANGE_ME_PUBLIC_HOST"
    BaseURL = http://${Const|BaseHostname}
    PublicPort = "9000"
    PrivURL = ${Const|BaseURL}
    PrivatePort = "8003"

[Startup]
    ConsolePrompt = "StandaloneHG (\R) # "
    ConsoleHistoryFileEnabled = true
    save_crashes = false
    async_call_method = SmartThreadPool
    MaxPoolThreads = 300
    MinPoolThreads = 32

    physical_prim = true
    meshing = ubODEMeshmerizer
    physics = ubODE
    DefaultScriptEngine = "YEngine"

    NonPhysicalPrimMax = 256
    PhysicalPrimMax = 64
    ClampPrimSize = false
    LinksetPrims = 0
    CombineContiguousRegions = false

[Network]
    http_listener_port = ${Const|PublicPort}
    ExternalHostNameForLSL = ${Const|BaseHostname}

[Hypergrid]
    GatekeeperURI = "${Const|BaseURL}:${Const|PublicPort}"
    HomeURI = "${Const|BaseURL}:${Const|PublicPort}"

[LoginService]
    WelcomeMessage = "Welcome to Standalone Hypergrid"
    SRV_HomeURI = "${Hypergrid|HomeURI}"
    SRV_InventoryServerURI = "${Const|BaseURL}:${Const|PublicPort}"
    SRV_AssetServerURI = "${Const|BaseURL}:${Const|PublicPort}"
    SRV_ProfileServerURI = "${Const|BaseURL}:${Const|PublicPort}"
    SRV_FriendsServerURI = "${Const|BaseURL}:${Const|PublicPort}"
    SRV_IMServerURI = "${Const|BaseURL}:${Const|PublicPort}"
    MapTileURL = "${Const|BaseURL}:${Const|PublicPort}/"
    Currency = "G$"
    AllowLoginFallbackToAnyRegion = true

[Map]
    GenerateMaptiles = true
    MapImageModule = "Warp3DImageModule"
    MaptileRefresh = 0
    GenerateMaptilesInBackground = true
    MaptileStartupDelaySeconds = 180
    MaptileThreadStackSizeKB = 8192
    MaptileDeferIfAgentsPresent = true
    MaptileForceGC = false
    StoreLegacyMaptileAssets = false
    TextureOnMapTile = true
    DrawPrimOnMapTile = true
    MapWaterDepthShading = true
    Map3DWaterDepthShading = true
    Map3DWaterDepthOpacity = 0.85

[Permissions]
    permissionmodules = DefaultPermissionsModule
    serverside_object_permissions = true
    allow_grid_gods = true

[Economy]
    economymodule = BetaGridLikeMoneyModule
    SellEnabled = true
    PriceUpload = 0
    PriceGroupCreate = 0
    InitialBalance = 1000
    BalanceStorage = StandaloneHG/Currency/balances.tsv
    TransactionLog = StandaloneHG/Currency/transactions.tsv
    AuditEnabled = true
    AllowNegativeBalances = false

[RegionWeb]
    Enabled = true
    PublicPath = "/regionweb"
    ContentDirectory = "RegionWeb"
    EstateTitle = "Standalone Hypergrid Estate"
    AutoCreateContent = true
    ShowMap = true
    ShowStats = true
    ShowParcels = true
    PostsPerPage = 5

    CurrencyPortalEnabled = true
    CurrencyBuyEnabled = true
    CurrencyBuyMode = "request"
    CurrencyPurchaseStorage = "StandaloneHG/Currency/regionweb-purchases.tsv"
    CurrencyTransferEnabled = true
    CurrencyChallengeMinutes = 10
    CurrencyChallengeCooldownSeconds = 20
    CurrencySessionHours = 12
    CurrencyStatementLimit = 50
    CurrencyBuyLimit = 100000

    PayPalEnabled = false
    PayPalEnvironment = "sandbox"
    PayPalClientID = ""
    PayPalClientSecret = ""
    PayPalCurrencyCode = "EUR"
    PayPalPricePerToken = "0.01"
    PayPalReturnBaseUrl = ""
    PayPalOrderStorage = "StandaloneHG/Currency/regionweb-paypal-orders.tsv"

[TextBuild]
    Enabled = true
    CommandChannel = 88
    EstateManagerOnly = true
    ImageTerrainMinLandHeight = 0.35
    ImageTerrainMaxLandHeight = 4.8
    ImageTerrainSeaDepth = 3.0
    ImageTerrainFitLandToRegion = true
    ImageTerrainSmoothPasses = 24

[Terrain]
    InitialTerrain = "pinhead-island"

[YEngine]
    Enabled = true
    MinTimerInterval = 0.05

[OSSL]
    Include-osslDefaultEnable = "config-include/osslDefaultEnable.ini"

[Architecture]
    Include-Storage = "config-include/storage/SQLiteStandalone.ini"
    Include-Architecture = "config-include/StandaloneHypergrid.ini"
