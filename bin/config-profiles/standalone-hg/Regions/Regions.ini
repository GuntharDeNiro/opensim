;; Sample region for a clean standalone Hypergrid lab.
;; Existing OSGrid servers should not install this unless they explicitly want
;; to replace their current Regions.ini.

[Welcome Area]
RegionUUID = CHANGE_ME_REGION_UUID
Location = 10000,10000
InternalAddress = 0.0.0.0
InternalPort = 9000
AllowAlternatePorts = False
ExternalHostName = CHANGE_ME_PUBLIC_HOST
DefaultLanding = <128,128,30>
MaxPrims = 30000
MaxAgents = 80
RegionType = "Standalone Hypergrid"
