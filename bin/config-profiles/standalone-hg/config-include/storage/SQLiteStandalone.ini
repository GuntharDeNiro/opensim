; Dedicated SQLite storage for the standalone Hypergrid profile.
; Keep these databases separate from OSGrid so switching profiles does not mix
; local users, inventory, assets, friends or currency ledger state.

[DatabaseService]
    StorageProvider = "OpenSim.Data.SQLite.dll"
    ConnectionString = "URI=file:StandaloneHG/OpenSim.db;UseUTF16Encoding=True"

[AssetService]
    ConnectionString = "URI=file:StandaloneHG/Asset.db"

[HGAssetService]
    ConnectionString = "URI=file:StandaloneHG/Asset.db"

[InventoryService]
    ConnectionString = "URI=file:StandaloneHG/inventory.db;UseUTF16Encoding=True"

[AvatarService]
    ConnectionString = "URI=file:StandaloneHG/avatars.db"

[AuthenticationService]
    ConnectionString = "URI=file:StandaloneHG/auth.db"

[UserAccountService]
    ConnectionString = "URI=file:StandaloneHG/userprofiles.db"

[GridUserService]
    ConnectionString = "URI=file:StandaloneHG/griduser.db"

[FriendsService]
    ConnectionString = "URI=file:StandaloneHG/friends.db"
